name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  test-build-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore windows/SaelBrowser.Windows.slnx
      - name: Test Windows core
        run: dotnet test windows/tests/SaelBrowser.Core.Tests/SaelBrowser.Core.Tests.csproj -c Release --no-restore
      - name: Build Windows release
        run: dotnet build windows/src/SaelBrowser.Windows/SaelBrowser.Windows.csproj -c Release --no-restore
      - name: Publish self-contained Windows release
        run: dotnet publish windows/src/SaelBrowser.Windows/SaelBrowser.Windows.csproj -c Release -r win-x64 --self-contained true -o windows/artifacts/publish/win-x64
      - name: Run real WebView2 smoke E2E
        timeout-minutes: 5
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sael-windows-e2e.json'
          $env:SAEL_SELF_TEST_OUTPUT = $output
          $process = Start-Process -FilePath 'windows/artifacts/publish/win-x64/SaelBrowser.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Windows E2E exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          $checks = @($result.PSObject.Properties)
          if ($checks.Count -ne 13) { throw "Windows E2E reported $($checks.Count) checks instead of 13" }
          if ($checks.Value -contains $false) { throw 'Windows E2E reported a failed check' }
      - name: Build MSI installer
        run: dotnet build windows/installer/SaelBrowser.Installer/SaelBrowser.Installer.wixproj -c Release
      - name: Confirm unsigned beta artifacts
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem 'windows/artifacts/installer/*.msi')
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)" }
          $files = @(
            Get-Item 'windows/artifacts/publish/win-x64/SaelBrowser.exe'
            $msi[0]
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Unsigned beta expects NotSigned for $($file.Name), got $($signature.Status)"
            }
          }
      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem 'windows/artifacts/installer/*.msi')
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)" }
          $hash = (Get-FileHash -LiteralPath $msi[0].FullName -Algorithm SHA256).Hash
          "$hash *$($msi[0].Name)" | Set-Content 'windows/artifacts/installer/SHA256SUMS.txt'
      - name: Verify SHA-256
        shell: pwsh
        run: |
          $line = (Get-Content 'windows/artifacts/installer/SHA256SUMS.txt' -Raw).Trim()
          if ($line -notmatch '^([A-Fa-f0-9]{64}) \*(.+\.msi)$') { throw 'Invalid SHA256SUMS.txt format' }
          $msi = Join-Path 'windows/artifacts/installer' $Matches[2]
          $actual = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          if ($actual -ne $Matches[1]) { throw 'MSI SHA-256 verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SaelBrowser-Windows-Unsigned-Beta
          path: |
            windows/artifacts/installer/*.msi
            windows/artifacts/installer/SHA256SUMS.txt
            windows/UNSIGNED-BETA-NOTICE.txt
          if-no-files-found: error
